# Nginx bên TRONG container frontend (khác với Nginx reverse-proxy trên host VPS, xem
# environment/nginx/app.conf). Việc này chỉ lo 1 job: trả static file của SPA và fallback về
# index.html cho client-side routing (react-router-dom) khi refresh ở route con như /debts.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # File build của Vite có hash trong tên (assets/xxx-HASH.js) -> cache dài hạn an toàn.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
