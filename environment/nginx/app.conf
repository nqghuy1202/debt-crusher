# Nginx reverse proxy CHẠY TRÊN CHÍNH VPS (không phải container) — đúng vai trò "Server IP (Nginx)"
# trong sơ đồ. Copy file này vào /etc/nginx/sites-available/debtcrusher, symlink sang sites-enabled,
# rồi chạy certbot --nginx (xem environment/DEPLOY.md) — certbot sẽ tự thêm block 443 + redirect 80->443
# vào đúng file này, không cần sửa tay.
#
# Backend không có prefix /api (routes là /auth, /debts, /payoff thẳng ở root — xem
# debtcrusher-controller/**/http/*Controller.java), nên route theo whitelist path bên dưới thay vì theo
# tiền tố /api. Thêm @RequestMapping root mới ở backend sau này thì nhớ thêm vào danh sách regex này.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Các path thuộc backend (Spring Boot, container debtcrusher-backend, bind 127.0.0.1:8080)
    location ~ ^/(auth|debts|payoff|actuator|v3/api-docs|swagger-ui) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Còn lại: SPA React (container debtcrusher-frontend, bind 127.0.0.1:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
