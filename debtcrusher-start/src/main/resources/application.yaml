spring:
  application:
    name: debtcrusher

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:debtcrusher}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    database: mysql
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: none # Schema quản lý bằng script ở environment/mysql/init, không để Hibernate tự sinh bảng
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  jackson:
    serialization:
      indent-output: true

server:
  port: ${PORT:8080}

app:
  cors:
    # Nhiều origin cách nhau bằng dấu phẩy. Mặc định chỉ frontend dev (Vite); production truyền qua
    # env APP_CORS_ALLOWED_ORIGINS (xem environment/docker-compose.prod.yml).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT — auth MVP: register/login/JWT thuần, không refresh-token rotation.
jwt:
  secret: ${JWT_SECRET:change-this-secret-in-prod-min-256-bit-xxxxxxxxxxxxxxxx}
  expiration: ${JWT_EXPIRATION:86400000} # 24h, tính bằng millisecond

resilience4j:
  ratelimiter:
    instances:
      authApi: # POST /auth/register, /auth/login — chống brute-force
        limitForPeriod: 20
        limitRefreshPeriod: 1m
        timeoutDuration: 0
        registerHealthIndicator: true

management:
  health:
    ratelimiters:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,ratelimiters
  endpoint:
    health:
      show-details: always
